name: Bootstrap npm lockfile on foundation branch
on:
  push:
    branches: [foundation/vite-typescript-mobile-ready-20261030]
permissions:
  contents: write
jobs:
  generate-lock:
    if: ${{ !contains(github.event.head_commit.message, 'Generate package-lock') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile if absent
        run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --package-lock-only --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate package-lock for reproducible builds"
          git push origin "HEAD:${GITHUB_REF_NAME}"

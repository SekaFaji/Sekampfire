name: Bug report
description: Report a reproducible problem with Sekampfire.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Sekampfire. Do not include private information in screenshots or logs.
  - type: input
    id: version
    attributes:
      label: Where did the problem happen?
      description: Game link or commit/branch, if known.
      placeholder: "GitHub Pages / local development"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome on Android, Firefox on Windows, etc."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to trigger the problem.
      placeholder: |
        1. Open the game
        2. Start or resume a run
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional details
      description: Add genuine screenshots, errors or relevant save details, with sensitive information removed.
    validations:
      required: false

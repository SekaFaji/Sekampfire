name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sekampfire-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Repository hygiene
        run: npm run repo:check
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
